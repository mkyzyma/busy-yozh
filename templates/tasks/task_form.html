{% extends 'base.html' %}

{% block title %}{{ page_title }} — Task Manager{% endblock %}

{% block content %}
<section class="form-panel">
    <a class="back-link" href="{% url 'tasks:task-list' %}">Все задачи</a>
    <h1>{{ page_title }}</h1>
    <form method="post" class="stacked-form">
        {% csrf_token %}
        {{ form.non_field_errors }}
        {{ form.as_p }}
        <div class="action-row">
            <button class="button" type="submit">{{ submit_label }}</button>
            <a class="button button-secondary" href="{% url 'tasks:task-list' %}">Отмена</a>
        </div>
    </form>
</section>
{% endblock %}
